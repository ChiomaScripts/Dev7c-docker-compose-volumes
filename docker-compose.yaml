services:

  # Python Girls That Code — FastAPI application (reused the FastAPI image published to Nexus in Dev7b)
  chioma-python-app:
    image: 159.89.153.232:8082/python-girls-that-code:1.0
    ports:
      - "8001:8000"     # Windows host -> FastAPI container
    env_file:
      - .env.docker     # Supplies MONGO_URI to the application
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  # MongoDB database
  mongodb:
    image: mongo
    ports:
     - 27018:27017      # Published here, but optional for internal access
    env_file:
      - .env.docker
    volumes:
     - chioma-mongo-data:/data/db    # MongoDB's persistent data directory
                                     # defines a mapping between host-volume-name:path-inside-the-mongo-db-container. 
                                     # this differs per db and should be the defualt path where the db stors its data
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --eval "db.adminCommand('ping').ok" | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped  

  # Mongo Express — database administration UI  
  mongo-express:
    image: techworldwithnana/mongo-express
    ports:
     - 8083:8081     # Windows browser -> Mongo Express UI
    env_file:
      - .env.docker
    depends_on:
     "mongodb":
        condition: service_healthy
    restart: unless-stopped

# Persistent MongoDB storage
volumes:              
  chioma-mongo-data:  # this is the name of the host volume 
    driver: local     # the actual storage path; this creates the physical storage on a local file system